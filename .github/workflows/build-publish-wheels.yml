name: Build and publish wheels

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types:
      - published
jobs:
  build-unix:
    strategy:
      fail-fast: False
      matrix:
        os: [ubuntu, macos]
        python-version: [3.13, 3.14]

    name: ${{ matrix.os }} with Python ${{ matrix.python-version }} built and tests
    # Match pycanha-core's CI runners: ubuntu-26.04 / macos-26 (windows uses its own job).
    runs-on: ${{ matrix.os == 'ubuntu' && 'ubuntu-26.04' || 'macos-26' }}
    timeout-minutes: 60

    steps:
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install python dependencies
        run: python -m pip install conan cmake ninja

      - name: Setup directories
        run: |
          mkdir pycanha-project
          cd pycanha-project
          mkdir pycanha-core pycanha-core-python
        shell: bash

      - name: Configure compiler (Linux)
        if: matrix.os == 'ubuntu'
        run: |
          echo "CC=gcc-15" >> "$GITHUB_ENV"
          echo "CXX=g++-15" >> "$GITHUB_ENV"

      - name: Configure compiler (macOS)
        if: matrix.os == 'macos'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Check out pycanha-core-python repo
        uses: actions/checkout@v4
        with:
          path: pycanha-project/pycanha-core-python

      - name: Get version from pyproject.toml
        run: |
          import os, tomllib
          from pathlib import Path
          pyproject = tomllib.loads(Path("pycanha-project/pycanha-core-python/pyproject.toml").read_text())
          version = ".".join(pyproject["project"]["version"].split(".")[:2])
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\n")
        shell: python
        id: metadata

      - name: Check out pycanha-core repo at version
        uses: actions/checkout@v4
        with:
          repository: pycanha-project/pycanha-core
          path: pycanha-project/pycanha-core
          ref: v${{ steps.metadata.outputs.version }}

      - name: Check MKL version consistency
        run: |
          import re, tomllib
          from pathlib import Path

          pyproject_path = Path("pycanha-project/pycanha-core-python/pyproject.toml")
          conanfile_path = Path("pycanha-project/pycanha-core/conanfile.py")

          pyproject = tomllib.loads(pyproject_path.read_text(encoding="utf-8"))
          pyproject_mkl = pyproject["project"]["optional-dependencies"]["mkl"][0].split("==", 1)[1]

          conanfile_text = conanfile_path.read_text(encoding="utf-8")
          core_mkl = re.search(r"['\"]mkl['\"]\s*:\s*['\"]([^'\"]+)['\"]", conanfile_text).group(1)
          assert pyproject_mkl == core_mkl, (
              f"MKL version mismatch: pyproject.toml has {pyproject_mkl}, pycanha-core has {core_mkl}"
          )

          print(f"MKL version check passed: {pyproject_mkl}")
        shell: python

      - name: Conan prepare
        run: |
          PROFILE="pycanha-project/pycanha-core-python/src/pycanha_core_bindings/pycanha-core-conan-profile"
          CORE="pycanha-project/pycanha-core"
          BINDINGS="pycanha-project/pycanha-core-python/src/pycanha_core_bindings"
          OUTPUT="pycanha-project/pycanha-core-python/build/conan-deps"

          USE_MKL=True
          if [ "${{ matrix.os }}" = "macos" ]; then
            USE_MKL=False
          fi

          conan export "$CORE"
          conan install "$BINDINGS" \
            -pr:h="$PROFILE" -pr:b="$PROFILE" \
            --build=missing \
            -of "$OUTPUT" \
            -o "pycanha-core*:PYCANHA_OPTION_USE_MKL=$USE_MKL"
        shell: bash

      - name: Build and install
        run: |
          cd pycanha-project/pycanha-core-python
          TOOLCHAIN="$(pwd)/build/conan-deps/conan_toolchain.cmake"
          EXTRAS=".[test,build]"
          if [ "${{ matrix.os }}" != "macos" ]; then
            EXTRAS=".[test,build,mkl]"
          fi
          pip install $EXTRAS \
            --config-settings=cmake.define.CMAKE_TOOLCHAIN_FILE="$TOOLCHAIN"
        shell: bash

      # Software Vulkan (lavapipe) so the radiative tests run their view-factor
      # end-to-end on the CPU. Mirrors pycanha-core's ubuntu-26.04 lavapipe step;
      # the ICD is pinned so the loader picks lavapipe and never a partially-
      # present hardware driver. REQUIRED: the radiative tests only skip on macOS,
      # so on Linux a missing/broken lavapipe is a real test failure.
      - name: Install lavapipe (software Vulkan)
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          # Glob instead of hardcoding: Mesa 26 dropped the arch suffix
          # (lvp_icd.json, previously lvp_icd.x86_64.json).
          ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          if [ -z "$ICD" ]; then
            echo "::error::no lavapipe ICD found in /usr/share/vulkan/icd.d"
            ls /usr/share/vulkan/icd.d/ || true
            exit 1
          fi
          echo "Using lavapipe ICD: $ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
          # Surface the device the loader will pick, so a broken driver is
          # diagnosed here and not in the radiative test assertions.
          VK_ICD_FILENAMES="$ICD" VK_DRIVER_FILES="$ICD" vulkaninfo --summary | grep -A5 "GPU0" || true
        shell: bash

      - name: Run tests
        run: cd pycanha-project/pycanha-core-python && pytest
        shell: bash

      - name: Build wheels
        run: |
          cd pycanha-project/pycanha-core-python
          TOOLCHAIN="$(pwd)/build/conan-deps/conan_toolchain.cmake"
          python -m build \
            -Ccmake.define.CMAKE_TOOLCHAIN_FILE="$TOOLCHAIN"
        shell: bash

      - name: Log built artifact sizes
        run: |
          python - <<'PY'
          from pathlib import Path

          dist = Path("pycanha-project/pycanha-core-python/dist")
          print("Built artifacts:")
          for artifact in sorted(dist.glob("*")):
              if artifact.is_file():
                  size_mib = artifact.stat().st_size / (1024 * 1024)
                  print(f"  {size_mib:8.2f} MiB  {artifact.name}")
          PY
        shell: bash

      - name: Log Linux wheel dependencies
        if: matrix.os == 'ubuntu'
        run: |
          cd pycanha-project/pycanha-core-python
          python -m pip install auditwheel
          python -m auditwheel show dist/*.whl
        shell: bash

      - name: Repair wheel with auditwheel
        if: matrix.os == 'ubuntu'
        run: |
          cd pycanha-project/pycanha-core-python/dist
          sudo apt-get update && sudo apt-get install -y patchelf
          # Use --plat auto instead of a hardcoded/derived tag: auditwheel inspects the
          # actual glibc symbol versions referenced by the compiled .so and picks the
          # most permissive (lowest) manylinux policy that's still valid for them.
          for whl in *.whl; do
            auditwheel repair "$whl" \
              --plat auto \
              --exclude 'libmkl_*.so*' \
              --exclude 'libiomp5.so*' \
              -w output
          done
          rm *.whl
          mv output/* .
          rm -r output
        shell: bash

      - name: Log repaired Linux wheel sizes
        if: matrix.os == 'ubuntu'
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          dist = Path("pycanha-project/pycanha-core-python/dist")
          print("Repaired Linux artifacts:")
          for artifact in sorted(dist.glob("*.whl")):
              size_mib = artifact.stat().st_size / (1024 * 1024)
              print(f"\n{artifact.name}: {size_mib:.2f} MiB")
              with zipfile.ZipFile(artifact) as zf:
                  biggest = sorted(
                      zf.infolist(), key=lambda info: info.file_size, reverse=True
                  )[:10]
              for info in biggest:
                  file_mib = info.file_size / (1024 * 1024)
                  print(f"  {file_mib:8.2f} MiB  {info.filename}")
          PY
        shell: bash

      - name: Extract stubs from wheel (Linux only)
        if: matrix.os == 'ubuntu' && matrix.python-version == '3.13'
        run: |
          cd pycanha-project/pycanha-core-python
          mkdir -p stubs
          for whl in dist/*.whl; do
            python -c "
          import zipfile, sys, shutil
          with zipfile.ZipFile(sys.argv[1]) as z:
              for name in z.namelist():
                  if name.startswith('pycanha_core/') and (name.endswith('.pyi') or name.endswith('py.typed')):
                      target = 'stubs/' + name.split('/', 1)[1]
                      with z.open(name) as src, open(target, 'wb') as dst:
                          shutil.copyfileobj(src, dst)
          " "$whl"
            break  # only need one wheel
          done
          echo "Extracted stubs:"
          ls -la stubs/
        shell: bash

      - name: Validate extracted stubs
        if: matrix.os == 'ubuntu' && matrix.python-version == '3.13'
        run: |
          cd pycanha-project/pycanha-core-python/stubs
          for f in __init__.pyi gmm.pyi tmm.pyi parameters.pyi solvers.pyi radiative.pyi conduction.pyi; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
          done
          test -f py.typed || { echo "Missing: py.typed"; exit 1; }
          echo "All stubs valid"
        shell: bash

      - name: Upload stubs artifact
        if: matrix.os == 'ubuntu' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: generated-stubs
          path: pycanha-project/pycanha-core-python/stubs/

      - uses: actions/upload-artifact@v4
        with:
          name: pycanha-dist-files-${{ matrix.os }}-${{ matrix.python-version }}
          path: pycanha-project/pycanha-core-python/dist/*.whl

      - name: Upload sdist
        if: matrix.os == 'ubuntu' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: pycanha-dist-files-sdist
          path: pycanha-project/pycanha-core-python/dist/*.tar.gz

  build-windows:
    needs: [build-unix]
    strategy:
      fail-fast: False
      matrix:
        python-version: [3.13, 3.14]

    name: windows with Python ${{ matrix.python-version }} built and tests
    # Match pycanha-core's CI runner (Visual Studio 2026 / MSVC v195).
    runs-on: windows-2025-vs2026
    timeout-minutes: 60

    steps:
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install python dependencies
        run: python -m pip install conan cmake ninja

      - name: Setup directories
        run: |
          mkdir pycanha-project
          cd pycanha-project
          mkdir pycanha-core pycanha-core-python
        shell: bash

      - name: Check out pycanha-core-python repo
        uses: actions/checkout@v4
        with:
          path: pycanha-project/pycanha-core-python

      - name: Get version from pyproject.toml
        run: |
          import os, tomllib
          from pathlib import Path
          pyproject = tomllib.loads(Path("pycanha-project/pycanha-core-python/pyproject.toml").read_text())
          version = ".".join(pyproject["project"]["version"].split(".")[:2])
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\n")
        shell: python
        id: metadata

      - name: Check out pycanha-core repo at version
        uses: actions/checkout@v4
        with:
          repository: pycanha-project/pycanha-core
          path: pycanha-project/pycanha-core
          ref: v${{ steps.metadata.outputs.version }}

      - name: Check MKL version consistency
        run: |
          import re, tomllib
          from pathlib import Path

          pyproject_path = Path("pycanha-project/pycanha-core-python/pyproject.toml")
          conanfile_path = Path("pycanha-project/pycanha-core/conanfile.py")

          pyproject = tomllib.loads(pyproject_path.read_text(encoding="utf-8"))
          pyproject_mkl = pyproject["project"]["optional-dependencies"]["mkl"][0].split("==", 1)[1]

          conanfile_text = conanfile_path.read_text(encoding="utf-8")
          core_mkl = re.search(r"['\"]mkl['\"]\s*:\s*['\"]([^'\"]+)['\"]", conanfile_text).group(1)
          assert pyproject_mkl == core_mkl, (
              f"MKL version mismatch: pyproject.toml has {pyproject_mkl}, pycanha-core has {core_mkl}"
          )

          print(f"MKL version check passed: {pyproject_mkl}")
        shell: python

      - name: Download pregenerated stubs
        uses: actions/download-artifact@v4
        with:
          name: generated-stubs
          path: pycanha-project/pycanha-core-python/pregenerated-stubs

      - name: Validate pregenerated stubs
        run: |
          cd pycanha-project/pycanha-core-python/pregenerated-stubs
          for f in __init__.pyi gmm.pyi tmm.pyi parameters.pyi solvers.pyi radiative.pyi conduction.pyi; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
          done
          test -f py.typed || { echo "Missing: py.typed"; exit 1; }
          echo "All stubs valid"
        shell: bash

      - name: Conan prepare
        run: |
          PROFILE="pycanha-project/pycanha-core-python/src/pycanha_core_bindings/pycanha-core-conan-profile"
          CORE="pycanha-project/pycanha-core"
          BINDINGS="pycanha-project/pycanha-core-python/src/pycanha_core_bindings"
          OUTPUT="pycanha-project/pycanha-core-python/build/conan-deps"

          conan export "$CORE"
          conan install "$BINDINGS" \
            -pr:h="$PROFILE" -pr:b="$PROFILE" \
            --build=missing \
            -of "$OUTPUT" \
            -o "pycanha-core*:PYCANHA_OPTION_USE_MKL=True"
        shell: bash

      - name: Build and install
        run: |
          cd pycanha-project/pycanha-core-python
          TOOLCHAIN="$(pwd)/build/conan-deps/conan_toolchain.cmake"
          STUBS_DIR="$(pwd)/pregenerated-stubs"
          pip install ".[test,build,mkl]" \
            --config-settings=cmake.define.CMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            --config-settings=cmake.define.PYCANHA_PREGENERATED_STUBS_DIR="$STUBS_DIR"
        shell: bash

      # Software Vulkan (lavapipe) so the radiative tests run their view-factor
      # end-to-end on the GPU-less runner — the Windows twin of the ubuntu job's
      # lavapipe step. mesa-dist-win supplies the lavapipe ICD (Mesa 26.0.x, the
      # same generation verified on Linux); volk dlopens vulkan-1.dll at runtime
      # and the runner has no GPU driver, so the Khronos loader comes from conan
      # (vulkan-loader, same version family as core's vulkan-headers/volk pins).
      # REQUIRED: the radiative tests only skip on macOS, so a missing/broken
      # lavapipe here is a real test failure.
      - name: Install lavapipe (software Vulkan)
        run: |
          MESA_VERSION=26.0.8
          MESA_SHA256=a438c26c2752726916e455f9ad121f8a7e3cfecf8626251abf8e5b3e129d8497
          curl -sSL -o mesa3d.7z \
            "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/mesa3d-${MESA_VERSION}-release-msvc.7z"
          echo "${MESA_SHA256}  mesa3d.7z" | sha256sum -c -
          7z x mesa3d.7z -omesa3d -y > /dev/null
          ICD="$(pwd)/mesa3d/x64/lvp_icd.x86_64.json"
          if [ ! -f "$ICD" ]; then
            echo "::error::lavapipe ICD not found in mesa-dist-win archive"
            ls mesa3d/x64 || true
            exit 1
          fi

          PROFILE="pycanha-project/pycanha-core-python/src/pycanha_core_bindings/pycanha-core-conan-profile"
          conan install --requires=vulkan-loader/1.4.350.0 --build=missing \
            -pr:h="$PROFILE" -pr:b="$PROFILE" \
            --deployer=direct_deploy --deployer-folder=vulkan-loader
          LOADER_DIR="$(pwd)/vulkan-loader/direct_deploy/vulkan-loader/bin"
          if [ ! -f "$LOADER_DIR/vulkan-1.dll" ]; then
            echo "::error::vulkan-1.dll not produced by conan vulkan-loader"
            find vulkan-loader -name '*.dll' || true
            exit 1
          fi

          # Python restricts the process DLL search (SetDefaultDllDirectories),
          # so volk's LoadLibraryA("vulkan-1.dll") ignores PATH entirely. The
          # application (python.exe) directory is always searched, so place the
          # loader there.
          PYDIR=$(cygpath -u "$(python -c 'import sys, os; print(os.path.dirname(sys.executable))')")
          cp "$LOADER_DIR/vulkan-1.dll" "$PYDIR/"

          # The runner executes everything elevated (UAC disabled), and the
          # Vulkan loader IGNORES VK_ICD_FILENAMES/VK_DRIVER_FILES in elevated
          # processes (loader security feature). Register the ICD in the HKLM
          # registry instead — the discovery path elevation does not disable.
          # The env vars are still set below for any non-elevated child.
          ICD_WIN=$(cygpath -w "$ICD")
          MSYS_NO_PATHCONV=1 reg add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' \
            /v "$ICD_WIN" /t REG_DWORD /d 0 /f

          echo "Using lavapipe ICD: $ICD_WIN"
          echo "VK_ICD_FILENAMES=$ICD_WIN" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$ICD_WIN" >> "$GITHUB_ENV"
        shell: bash

      - name: Show Vulkan device seen by the extension
        env:
          # Loader-internal tracing: if no device shows up, this prints WHY
          # (which manifests were found, why an ICD was skipped, etc.).
          VK_LOADER_DEBUG: error,warn,driver
        run: |
          cd pycanha-project/pycanha-core-python
          python -c "
          import sys
          import pycanha_core as pcc
          rad = pcc.radiative
          ok = rad.is_available()
          print('is_available:', ok)
          for d in rad.enumerate_devices():
              print(f'  device {d.index}: {d.name} ray_tracing={d.ray_tracing}')
          if not ok:
              sys.exit('::error::lavapipe not visible to the extension - check the install step')
          "
        shell: bash

      - name: Run tests
        run: cd pycanha-project/pycanha-core-python && pytest
        shell: bash

      - name: Build wheels
        run: |
          cd pycanha-project/pycanha-core-python
          TOOLCHAIN="$(pwd)/build/conan-deps/conan_toolchain.cmake"
          STUBS_DIR="$(pwd)/pregenerated-stubs"
          python -m build \
            -Ccmake.define.CMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -Ccmake.define.PYCANHA_PREGENERATED_STUBS_DIR="$STUBS_DIR"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: pycanha-dist-files-windows-${{ matrix.python-version }}
          path: pycanha-project/pycanha-core-python/dist/*.whl

  upload_pypi:
    name: Publish to PyPI
    needs: [build-unix, build-windows]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pycanha-core
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pycanha-dist-files*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1

  trigger_rtd:
    name: Trigger Read the Docs
    needs: [upload_pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: read
    env:
      RTD_PROJECT_SLUG: pycanha-core-python
      RTD_API_URL: https://app.readthedocs.org/api/v3
      RTD_TOKEN: ${{ secrets.RTD_TOKEN }}
      VERSION_SLUG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check configuration
        run: |
          test -n "$VERSION_SLUG"
          if [ -z "$RTD_TOKEN" ]; then
            echo "RTD_TOKEN secret is not configured."
            exit 1
          fi

      - name: Sync Read the Docs versions
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Token $RTD_TOKEN" \
            "$RTD_API_URL/projects/$RTD_PROJECT_SLUG/sync-versions/"

      - name: Activate and build Read the Docs version
        run: |
          for attempt in 1 2 3 4 5; do
            status_code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -H "Authorization: Token $RTD_TOKEN" \
              "$RTD_API_URL/projects/$RTD_PROJECT_SLUG/versions/$VERSION_SLUG/")
            if [ "$status_code" = "200" ]; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              exit 1
            fi
            sleep 5
          done

          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Token $RTD_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"active": true, "hidden": false}' \
            "$RTD_API_URL/projects/$RTD_PROJECT_SLUG/versions/$VERSION_SLUG/"

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Token $RTD_TOKEN" \
            "$RTD_API_URL/projects/$RTD_PROJECT_SLUG/versions/$VERSION_SLUG/builds/"

      - name: Print dashboard URL
        run: |
          echo "Build requested for https://app.readthedocs.org/projects/$RTD_PROJECT_SLUG/builds/"
          echo "Version URL: https://app.readthedocs.org/projects/$RTD_PROJECT_SLUG/version/$VERSION_SLUG/"
